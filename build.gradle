plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.9.28'
}

group = 'org.spring'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

graalvmNative {
    binaries {
        main {
            imageName = 'shop-agent'
            buildArgs.add('--no-fallback')
            buildArgs.add('--report-unsupported-elements-at-runtime')
            buildArgs.add('--initialize-at-build-time=org.apache.ibatis')
            buildArgs.add('--initialize-at-run-time=com.zaxxer.hikari,com.mysql.cj,io.netty,com.fasterxml.jackson,org.slf4j')
            buildArgs.add('--enable-url-protocols=http,https')
            buildArgs.add('-H:+AddAllCharsets')
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-H:IncludeResources=.*\\.xml')
            buildArgs.add('-H:IncludeResources=.*\\.yml')
            buildArgs.add('-H:IncludeResources=.*\\.properties')
            buildArgs.add('-H:+ReportExceptionStackTraces')
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    // No-op SLF4J implementation for native image
    implementation 'org.slf4j:slf4j-nop:2.0.7'
    
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation('com.zaxxer:HikariCP:5.1.0') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3') {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('mysql:mysql-connector-java:8.0.33') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation('org.reflections:reflections:0.10.2') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation('org.springframework.boot:spring-boot-starter-validation') {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('com.google.genai:google-genai:1.0.0') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

}

tasks.named('test') {
    useJUnitPlatform()
}
