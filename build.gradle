plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.9.28'
}

group = 'org.spring'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        // vendor = JvmVendorSpec.ORACLE  // GitHub Actions와 호환성을 위해 제거
    }
}

configurations.all {
    exclude group: 'commons-logging', module: 'commons-logging'
}

graalvmNative {
    toolchainDetection = true

    binaries {
        main {
            imageName = 'shop-agent'
            buildArgs.add('--no-fallback')
            buildArgs.add('--report-unsupported-elements-at-runtime')

            buildArgs.add('--initialize-at-run-time=org.apache.ibatis,org.mybatis,org.mybatis.spring')

            // ↓ 로그/커넥터/네티/잭슨/커먼즈-로깅/SLF4J는 런타임 초기화
            buildArgs.add('--initialize-at-run-time=ch.qos.logback')
            buildArgs.add('--initialize-at-run-time=ch.qos.logback.classic')
            buildArgs.add('--initialize-at-run-time=ch.qos.logback.core')
            buildArgs.add('--initialize-at-run-time=org.slf4j,org.slf4j.helpers')
            buildArgs.add('--initialize-at-run-time=org.apache.commons.logging')
            buildArgs.add('--initialize-at-run-time=com.zaxxer.hikari,com.mysql.cj,io.netty,com.fasterxml.jackson')
            buildArgs.add('--initialize-at-run-time=java.sql.DriverManager')
            buildArgs.add('--initialize-at-run-time=java.sql.Driver')
            
            // ↓ Hibernate Validator와 JBoss 로깅 런타임 초기화
            buildArgs.add('--initialize-at-run-time=org.hibernate.validator')
            buildArgs.add('--initialize-at-run-time=org.jboss.logging')
            buildArgs.add('--initialize-at-run-time=jakarta.validation')

            buildArgs.add('-H:ClassInitialization=' +
                    'org.slf4j.LoggerFactory:rerun,' +
                    'org.slf4j.MarkerFactory:rerun,' +
                    'org.slf4j.helpers.Reporter:rerun,' +
                    'ch.qos.logback.classic.Logger:rerun,' +
                    'ch.qos.logback.classic.Level:rerun,' +
                    'ch.qos.logback.core.util.StatusPrinter:rerun,' +
                    'ch.qos.logback.core.util.StatusPrinter2:rerun,' +
                    'ch.qos.logback.core.util.Loader:rerun,' +
                    'ch.qos.logback.core.status.StatusBase:rerun,' +
                    'ch.qos.logback.core.status.InfoStatus:rerun'
            )

            buildArgs.add('--enable-url-protocols=http,https')
            buildArgs.add('-H:+AddAllCharsets')
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-H:IncludeResources=.*\\.xml')
            buildArgs.add('-H:IncludeResources=.*\\.yml')
            buildArgs.add('-H:IncludeResources=.*\\.properties')
            buildArgs.add('-H:+ReportExceptionStackTraces')
        }
    }
}


// 개발용 빠른 Native Image 빌드
tasks.register('nativeCompileDev') {
    group = 'native'
    description = '빠른 개발용 Native Image 빌드'

    dependsOn 'nativeCompile'

    doLast {
        println '개발용 Native Image 빌드 완료'
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    
    compileOnly 'org.projectlombok:lombok'

    implementation "com.h2database:h2:2.2.224"
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.google.genai:google-genai:1.0.0'

    implementation 'ch.qos.logback:logback-classic'
    implementation "org.javassist:javassist:3.29.2-GA"

}

tasks.named('test') {
    useJUnitPlatform()
}
