spring:
  application:
    name: shopAgent
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

custom:
  h2:
    url: jdbc:h2:file:./data/shopagent-h2-db
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    root: warn

mybatis:
  configuration:
    map-underscore-to-camel-case: true