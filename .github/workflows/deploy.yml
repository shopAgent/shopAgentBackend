name: CI/CD to EC2 - Spring Boot + React

on:
  push:
    branches: [ main ]

env:
  REACT_REPO: shopAgent/studio
  REACT_BUILD_DIR: frontend-build
  SPRING_STATIC_PATH: shopAgent/src/main/resources/static

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Spring Boot Repository
      uses: actions/checkout@v3

    - name: Clone React Repository (Private)
      run: |
        git clone https://x-access-token:${{ secrets.REACT_REPO_TOKEN }}@github.com/${{ env.REACT_REPO }} ${{ env.REACT_BUILD_DIR }}

    - name: Build React App (Lint 무시) (임시)
      working-directory: ${{ env.REACT_BUILD_DIR }}
      run: |
        npm install
        CI=false npm run build 

    - name: Build React App (Ignore ESLint Errors)
      working-directory: ${{ env.REACT_BUILD_DIR }}
      run: |
        npm install
        CI=false npm run build

    - name: Copy React Build to Spring Boot Static Resources
      run: |
        mkdir -p shopAgent/src/main/resources/static
        rm -rf shopAgent/src/main/resources/static/*
        cp -r frontend-build/build/* shopAgent/src/main/resources/static/

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Print current directory structure
      run: |
        pwd
        ls -al
        ls -al shopAgent || true
        ls -al shopAgentBackend || true

    - name: Build Spring Boot App
      run: ./gradlew bootJar

    # 👉 EC2 서버로 배포 시작
    - name: Add SSH Key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem

    - name: Deploy to EC2
      run: |
        scp -o StrictHostKeyChecking=no -i private_key.pem shopAgentBackend/build/libs/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "bash /home/${{ secrets.EC2_USER }}/deploy.sh"

