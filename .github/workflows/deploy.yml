name: CI/CD to EC2 - Spring Boot + React

on:
  push:
    branches: [ main ]

env:
  REACT_REPO: shopAgent/studio
  REACT_BUILD_DIR: frontend-build
  SPRING_STATIC_PATH: src/main/resources/static

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Spring Boot Repository
      uses: actions/checkout@v3

    - name: Clone React Repository (Private)
      run: |
        git clone https://x-access-token:${{ secrets.REACT_REPO_TOKEN }}@github.com/${{ env.REACT_REPO }} ${{ env.REACT_BUILD_DIR }}

    - name: Build React App (Lint 무시) (임시)
      working-directory: ${{ env.REACT_BUILD_DIR }}
      run: |
        npm install
        CI=false npm run build

    - name: Print React Build Output
      run: |
        echo "✅ React Build 결과 확인"
        ls -al frontend-build/build/
        ls -al frontend-build/build/static || true
        cat frontend-build/build/index.html | head -n 5

    - name: Copy React Build to Spring Boot Static Resources
      run: |
        mkdir -p src/main/resources/static
        rm -rf src/main/resources/static/*
        cp -r frontend-build/build/* src/main/resources/static/

    - name: Print Spring static/ 복사 결과
      run: |
        echo "✅ Spring static/ 폴더에 복사된 결과"
        ls -al src/main/resources/static/
        ls -al src/main/resources/static/static || true
        cat src/main/resources/static/index.html | head -n 5


    - name: Set up GraalVM JDK 21
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Print current directory structure
      run: |
        pwd
        ls -al
        java -version
        native-image --version

    - name: Build Native Image
      run: ./gradlew nativeCompile

    - name: Check native image build result
      run: |
        echo "✅ 네이티브 이미지 빌드 결과"
        ls -al build/native/nativeCompile/
        file build/native/nativeCompile/shop-agent

    # 👉 EC2 서버로 배포 시작
    - name: Add SSH Key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem

    - name: Deploy Native Image to EC2
      run: |
        scp -o StrictHostKeyChecking=no -i private_key.pem build/native/nativeCompile/shop-agent ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "chmod +x /home/${{ secrets.EC2_USER }}/app/shop-agent && bash /home/${{ secrets.EC2_USER }}/app/deploy.sh"

