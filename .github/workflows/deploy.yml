name: CI/CD to EC2 - Spring Boot Native + React

on:
  push:
    branches: [ main ]

env:
  REACT_REPO: shopAgent/studio
  REACT_BUILD_DIR: frontend-build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Spring Boot Repository
        uses: actions/checkout@v3

      - name: Clone React Repository (Private)
        run: |
          git clone https://x-access-token:${{ secrets.REACT_REPO_TOKEN }}@github.com/${{ env.REACT_REPO }} ${{ env.REACT_BUILD_DIR }}

      - name: Build React App (Ignore Lint Temporarily)
        working-directory: ${{ env.REACT_BUILD_DIR }}
        run: |
          npm install
          CI=false npm run build

      - name: Copy React Build to Spring Boot Static Resources
        run: |
          mkdir -p src/main/resources/static
          rm -rf src/main/resources/static/*
          cp -r ${{ env.REACT_BUILD_DIR }}/build/* src/main/resources/static/

      - name: Print Static Directory
        run: |
          echo "static 디렉토리 내용 확인"
          ls -al src/main/resources/static/
          cat src/main/resources/static/index.html | head -n 10

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '22.3.2'
          java-version: '21'
          distribution: 'graalvm'
          components: 'native-image'

      - name: Build Native Executable
        run: ./gradlew nativeCompile

      - name: Dump native-image error log
        if: failure()
        run: |
          echo "🔍 GraalVM native-image error 로그:"
          find build -name '*.log' -exec cat {} \; || echo "Log 파일 없음"

      - name: Run nativeCompile and save logs
        run: |
          ./gradlew nativeCompile --info > native-image.log 2>&1 || true
          cat native-image.log | tail -n 100

      - name: Check Native Executable
        run: |
          echo "Native Executable 확인"
          ls -al build/native/nativeCompile/
          file build/native/nativeCompile/*

      - name: Add SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy Native Executable to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i private_key.pem build/native/nativeCompile/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/${{ secrets.EC2_USER }}/app/
            pkill -f shop-agent || true
            chmod +x shop-agent
            nohup ./shop-agent > app.log 2>&1 &
            echo "앱 실행 완료"
          EOF
